[package]
name = "dbx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.34"
keyring = "4.2.0"
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
ratatui = "0.30.2"
rust_decimal = { version = "1.42.1", features = ["db-tokio-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "chrono", "rustls"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
toml = "1.1.4"
toml_edit = "0.25.13"
uuid = "1.26.0"
