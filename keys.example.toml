[global]
"ctrl+c"       = "cancel-query"
"ctrl+q"       = "quit"
"?"            = "help"
":"            = "command-mode"
"esc"          = "escape"
"ctrl+h"       = "pane-left"
"ctrl+l"       = "pane-right"
"ctrl+j"       = "pane-down"
"ctrl+k"       = "pane-up"
"ctrl+t"       = "focus-tree"
"ctrl+e"       = "focus-editor"
"ctrl+g"       = "focus-grid"
"ctrl+n"       = "new-query-tab"
"ctrl+w"       = "close-tab"
"ctrl+f"       = "toggle-fullscreen"
"f5"           = "refresh"
"alt+l"        = "next-tab"
"alt+h"        = "prev-tab"

[tree]
"j"            = "down"
"k"            = "up"
"down"         = "down"
"up"           = "up"
"l"            = "expand"
"h"            = "collapse"
"right"        = "expand"
"left"         = "collapse"
"space"        = "toggle"
"enter"        = "open"
"s"            = "open-structure"
"g g"          = "top"
"G"            = "bottom"
"ctrl+d"       = "half-down"
"ctrl+u"       = "half-up"
"/"            = "filter"
"q"            = "quit"
"r"            = "refresh"
"J"            = "next-connection"
"K"            = "prev-connection"
"a"            = "add-connection"
"A"            = "add-project"
"e"            = "edit-entry"
"D"            = "delete-entry"
"t"            = "test-connection"

[grid]
"j"            = "down"
"k"            = "up"
"h"            = "left"
"l"            = "right"
"down"         = "down"
"up"           = "up"
"left"         = "left"
"right"        = "right"
"0"            = "row-start"
"$"            = "row-end"
"g g"          = "top"
"G"            = "bottom"
"ctrl+d"       = "half-down"
"ctrl+u"       = "half-up"
"pagedown"     = "next-page"
"pageup"       = "prev-page"
"L"            = "next-page"
"H"            = "prev-page"
"y"            = "yank-cell"
"Y"            = "yank-row"
"enter"        = "inspect"
"/"            = "search"
"n"            = "search-next"
"N"            = "search-prev"
"q"            = "focus-tree"
"r"            = "refresh"

[editor]
"i"            = "insert-mode"
"a"            = "insert-after"
"I"            = "insert-line-start"
"A"            = "append-line-end"
"o"            = "open-line-below"
"O"            = "open-line-above"
"j"            = "down"
"k"            = "up"
"h"            = "left"
"l"            = "right"
"down"         = "down"
"up"           = "up"
"left"         = "left"
"right"        = "right"
"w"            = "word-forward"
"b"            = "word-back"
"0"            = "row-start"
"$"            = "row-end"
"g g"          = "top"
"G"            = "bottom"
"d d"          = "delete-line"
"x"            = "delete-char"
"u"            = "undo"
"ctrl+r"       = "run-statement"
"ctrl+a"       = "run-all"
"enter"        = "run-statement"
"["            = "history-prev"
"]"            = "history-next"

